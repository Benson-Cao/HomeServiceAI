name: contracts-and-kernel

on:
  pull_request:
    paths: ['seams/**', 'src/**', 'ci/**', 'tests/**', 'examples/**', 'package.json', 'tsconfig.json', '.github/**']
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install build toolchain
        run: npm install --no-audit --no-fund
      - name: contracts + kernel + V0.7 acceptance (pretest auto-builds)
        run: npm run verify
      - name: dump-tree diagnostics
        run: npm run dump:tree
